<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거래처 공정 진행률 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #f5f5f3;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 4px;
    color: #1a1a1a;
  }
  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 2rem;
  }

  /* Summary */
  .summary-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .07em;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 2rem;
  }
  .summary-card {
    background: #fff;
    border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .summary-card .s-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
  }
  .summary-card .s-value {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 8px;
  }

  /* Table */
  .table-wrap {
    background: #fff;
    border: 0.5px solid rgba(0,0,0,0.1);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 2rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead tr {
    background: #fafafa;
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
  }
  th {
    font-size: 11px;
    font-weight: 500;
    color: #888;
    text-align: left;
    padding: 10px 12px;
    white-space: nowrap;
  }
  td {
    padding: 8px 12px;
    border-bottom: 0.5px solid rgba(0,0,0,0.07);
    vertical-align: middle;
    color: #1a1a1a;
  }
  tbody tr:last-child td { border-bottom: none; }

  /* Row types */
  tr.major-client td {
    background: #0C447C;
    color: #E6F1FB;
    font-weight: 500;
    font-size: 13px;
    border-bottom: none;
  }
  tr.minor-client td {
    background: #185FA5;
    color: #B5D4F4;
    font-weight: 500;
    font-size: 12px;
    border-bottom: none;
  }
  tr.process-row td { background: #fff; }
  tr.process-row.done td {
    background: #f7f7f6;
    color: #aaa;
  }
  tr.process-row.done .process-name {
    text-decoration: line-through;
    color: #bbb;
  }

  /* Progress bar */
  .bar-outer {
    height: 8px;
    background: #f0f0ee;
    border-radius: 99px;
    overflow: hidden;
    border: 0.5px solid rgba(0,0,0,0.08);
  }
  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width .4s ease;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bar-row .bar-outer { flex: 1; }
  .bar-pct {
    font-size: 12px;
    font-weight: 500;
    min-width: 34px;
    text-align: right;
  }

  /* Badge */
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 99px;
    font-weight: 500;
  }
  .badge.done { background: #EAF3DE; color: #3B6D11; }
  .badge.todo { background: #f0f0ee; color: #888; }

  /* Checkbox */
  input[type=checkbox] {
    width: 15px;
    height: 15px;
    cursor: pointer;
    accent-color: #639922;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .toolbar-label { font-size: 13px; color: #888; }
  select {
    font-size: 13px;
    padding: 6px 10px;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 8px;
    background: #fff;
    color: #1a1a1a;
    cursor: pointer;
  }
  .legend {
    display: flex;
    gap: 14px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #888;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  @media (max-width: 700px) {
    body { padding: 1rem; }
    table { font-size: 12px; }
    th, td { padding: 7px 8px; }
  }
</style>
</head>
<body>

<h1>거래처 공정 진행률 관리</h1>
<p class="subtitle">실시간 공정 현황 · 체크박스 클릭으로 완료 처리</p>

<div class="summary-label">전체 요약</div>
<div class="summary-cards" id="summary-cards"></div>

<div class="toolbar">
  <span class="toolbar-label">필터</span>
  <select id="filter-select" onchange="renderTable()">
    <option value="all">전체 보기</option>
    <option value="todo">미완료만</option>
    <option value="done">완료만</option>
  </select>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#A32D2D"></div>0~49%</div>
    <div class="legend-item"><div class="legend-dot" style="background:#BA7517"></div>50~99%</div>
    <div class="legend-item"><div class="legend-dot" style="background:#639922"></div>100%</div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:100px">구분</th>
        <th style="width:80px">공정명</th>
        <th style="width:80px">담당자</th>
        <th style="width:90px">시작일</th>
        <th style="width:90px">완료예정일</th>
        <th style="width:68px">완료여부</th>
        <th style="width:160px">진행률</th>
        <th>비고</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
const data = [
  {type:'major', name:'오리온', id:'orion'},
  {type:'minor', name:'오리온 청주', parent:'orion', id:'orion_cj'},
  {type:'process', client:'orion_cj', name:'설계',    person:'김민준', start:'2024-01-02', end:'2024-01-10', done:true,  note:'도면 승인 완료'},
  {type:'process', client:'orion_cj', name:'자재발주', person:'이서연', start:'2024-01-11', end:'2024-01-18', done:true,  note:''},
  {type:'process', client:'orion_cj', name:'가공',    person:'박도현', start:'2024-01-19', end:'2024-01-30', done:true,  note:''},
  {type:'process', client:'orion_cj', name:'제작',    person:'최지우', start:'2024-02-01', end:'2024-02-15', done:true,  note:''},
  {type:'process', client:'orion_cj', name:'표면처리', person:'정하은', start:'2024-02-16', end:'2024-02-22', done:false, note:'진행중'},
  {type:'process', client:'orion_cj', name:'조립',    person:'한승호', start:'2024-02-23', end:'2024-03-01', done:false, note:''},
  {type:'process', client:'orion_cj', name:'검수',    person:'오수빈', start:'2024-03-02', end:'2024-03-05', done:false, note:''},
  {type:'process', client:'orion_cj', name:'포장',    person:'임지훈', start:'2024-03-06', end:'2024-03-08', done:false, note:''},
  {type:'process', client:'orion_cj', name:'운송',    person:'신예린', start:'2024-03-09', end:'2024-03-12', done:false, note:''},
  {type:'minor', name:'오리온 인도', parent:'orion', id:'orion_in'},
  {type:'process', client:'orion_in', name:'설계',    person:'강태양', start:'2024-01-15', end:'2024-01-25', done:true,  note:'현지 규격 반영'},
  {type:'process', client:'orion_in', name:'자재발주', person:'윤채원', start:'2024-01-26', end:'2024-02-05', done:true,  note:''},
  {type:'process', client:'orion_in', name:'가공',    person:'문준혁', start:'2024-02-06', end:'2024-02-20', done:false, note:'지연 예상'},
  {type:'process', client:'orion_in', name:'제작',    person:'배소현', start:'2024-02-21', end:'2024-03-05', done:false, note:''},
  {type:'process', client:'orion_in', name:'표면처리', person:'조민재', start:'2024-03-06', end:'2024-03-12', done:false, note:''},
  {type:'process', client:'orion_in', name:'조립',    person:'황지수', start:'2024-03-13', end:'2024-03-20', done:false, note:''},
  {type:'process', client:'orion_in', name:'검수',    person:'남다은', start:'2024-03-21', end:'2024-03-24', done:false, note:''},
  {type:'process', client:'orion_in', name:'포장',    person:'류성진', start:'2024-03-25', end:'2024-03-27', done:false, note:''},
  {type:'process', client:'orion_in', name:'운송',    person:'전아름', start:'2024-03-28', end:'2024-04-01', done:false, note:'해운 예정'},
];

function barColor(pct) {
  if (pct === 100) return '#639922';
  if (pct >= 50)   return '#BA7517';
  return '#A32D2D';
}

function calcPct(clientId) {
  const rows = data.filter(d => d.type === 'process' && d.client === clientId);
  if (!rows.length) return 0;
  return Math.round(rows.filter(r => r.done).length / rows.length * 100);
}

function calcMajorPct(majorId) {
  const minors = data.filter(d => d.type === 'minor' && d.parent === majorId);
  if (!minors.length) return 0;
  const vals = minors.map(m => calcPct(m.id));
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

function barHtml(pct, h = 8) {
  const c = barColor(pct);
  return `<div class="bar-row">
    <div class="bar-outer" style="height:${h}px">
      <div class="bar-fill" style="width:${pct}%;background:${c}"></div>
    </div>
    <span class="bar-pct" style="color:${c}">${pct}%</span>
  </div>`;
}

function renderSummary() {
  const majors = data.filter(d => d.type === 'major');
  let html = '';
  majors.forEach(major => {
    const pct = calcMajorPct(major.id);
    html += `<div class="summary-card">
      <div class="s-label">🏢 ${major.name} (대거래처)</div>
      <div class="s-value" style="color:${barColor(pct)}">${pct}%</div>
      ${barHtml(pct, 10)}
    </div>`;
    data.filter(d => d.type === 'minor' && d.parent === major.id).forEach(m => {
      const mp = calcPct(m.id);
      html += `<div class="summary-card">
        <div class="s-label" style="padding-left:10px">↳ ${m.name}</div>
        <div class="s-value" style="font-size:18px;color:${barColor(mp)}">${mp}%</div>
        ${barHtml(mp, 8)}
      </div>`;
    });
  });
  document.getElementById('summary-cards').innerHTML = html;
}

function renderTable() {
  const filter = document.getElementById('filter-select').value;
  const tbody = document.getElementById('table-body');
  let html = '';

  let currentMajor = null;
  let currentMinor = null;
  let majorVisible = {};
  let minorVisible = {};

  // Pre-calc visibility
  data.forEach((row, idx) => {
    if (row.type === 'major') { currentMajor = row.id; majorVisible[row.id] = false; }
    if (row.type === 'minor') { currentMinor = row.id; minorVisible[row.id] = false; }
    if (row.type === 'process') {
      const show = filter === 'all' || (filter === 'done' && row.done) || (filter === 'todo' && !row.done);
      if (show) {
        minorVisible[row.client] = true;
        const minor = data.find(d => d.type === 'minor' && d.id === row.client);
        if (minor) majorVisible[minor.parent] = true;
      }
    }
  });

  currentMajor = null; currentMinor = null;

  data.forEach((row, idx) => {
    if (row.type === 'major') {
      currentMajor = row;
      if (filter !== 'all' && !majorVisible[row.id]) return;
      const pct = calcMajorPct(row.id);
      html += `<tr class="major-client">
        <td colspan="2">🏢 ${row.name}</td>
        <td colspan="2" style="color:#85B7EB;font-size:12px">대거래처</td>
        <td></td><td></td>
        <td>${barHtml(pct, 10)}</td>
        <td></td>
      </tr>`;
    } else if (row.type === 'minor') {
      currentMinor = row;
      if (filter !== 'all' && !minorVisible[row.id]) return;
      const pct = calcPct(row.id);
      html += `<tr class="minor-client">
        <td colspan="2" style="padding-left:22px">↳ ${row.name}</td>
        <td colspan="2" style="color:#85B7EB;font-size:12px">소거래처</td>
        <td></td><td></td>
        <td>${barHtml(pct, 9)}</td>
        <td></td>
      </tr>`;
    } else {
      const show = filter === 'all' || (filter === 'done' && row.done) || (filter === 'todo' && !row.done);
      if (!show) return;
      const dc = row.done ? 'done' : '';
      html += `<tr class="process-row ${dc}">
        <td style="padding-left:36px;color:#aaa;font-size:12px">공정</td>
        <td><span class="process-name">${row.name}</span></td>
        <td style="color:#666">${row.person}</td>
        <td style="color:#888;font-size:12px">${row.start}</td>
        <td style="color:#888;font-size:12px">${row.end}</td>
        <td><input type="checkbox" ${row.done ? 'checked' : ''} data-idx="${idx}" onchange="toggle(this)"></td>
        <td>${barHtml(row.done ? 100 : 0)}</td>
        <td style="color:#888;font-size:12px">${row.note || ''}</td>
      </tr>`;
    }
  });

  tbody.innerHTML = html;
}

function toggle(cb) {
  const idx = parseInt(cb.dataset.idx);
  data[idx].done = cb.checked;
  renderTable();
  renderSummary();
}

renderSummary();
renderTable();
</script>
</body>
</html>
